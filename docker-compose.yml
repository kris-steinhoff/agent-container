services:
  agent:
    build:
      context: .
      args:
        # Cache gate for the fast-moving tools (see Dockerfile). Unset -> 0,
        # which reuses the cache. The `agent-up` alias in the README exports a
        # fresh timestamp so a plain build reinstalls claude/copilot/codex/herdr.
        TOOLS_REFRESH: ${TOOLS_REFRESH:-0}
        # Unset by default (useradd picks its normal free uid). Set AGENT_UID
        # in .envrc (e.g. to `$(id -u)`) to match the agent user's uid to the
        # host, so both sides can write files in the shared scratch directory
        # — see README.md#shared-scratch-directory.
        AGENT_UID: ${AGENT_UID:-}
    image: agent-container
    ports:
      - "127.0.0.1:2222:22"
      - "127.0.0.1:8000:8000"
    extra_hosts:
      # Colima's host.docker.internal support has version-dependent quirks;
      # this makes it explicit rather than relying on the VM defaults.
      - "host.docker.internal:host-gateway"
    volumes:
      - ssh_host_keys:/etc/ssh
      # Named volume, opaque to the host. docker-compose.local.yml adds a
      # bind mount at /home/agent/scratch for handing files back and forth
      # with the desktop — see README.md#shared-scratch-directory.
      - agent_home:/home/agent
      - ./authorized_keys:/run/agent-container/authorized_keys:ro
      # Mount a project in to work on it. Anything not mounted lives only
      # in agent_home and disappears if that volume is removed.
      # - ~/code/github.com/kris-steinhoff/some-project:/home/agent/workspace/some-project
    environment:
      - GITHUB_TOKEN
      - GITLAB_TOKEN

volumes:
  ssh_host_keys:
  agent_home:
